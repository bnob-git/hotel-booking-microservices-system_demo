spring:
  datasource:
    url: jdbc:h2:mem:usertest
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

  # Migrations are PostgreSQL-specific; tests keep the Hibernate-generated
  # H2 schema (see docs/CONVENTIONS.md).
  flyway:
    enabled: false

jwt:
  secret: test-only-jwt-secret-key-32-bytes-minimum