apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config

data:
  USER_SERVICE_URL: {{ .Values.apiGateway.userServiceUrl | quote }}
  BOOKING_SERVICE_URL: {{ .Values.apiGateway.bookingServiceUrl | quote }}
  AI_CHAT_SERVICE_URL: {{ .Values.apiGateway.aiChatServiceUrl | quote }}

  AI_ENABLED: {{ .Values.app.aiEnabled | quote }}
  JWT_EXPIRATION_MINUTES: {{ .Values.app.jwtExpirationMinutes | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway

spec:
  replicas: {{ .Values.apiGateway.replicas }}

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway

          image: {{ .Values.apiGateway.image }}
          imagePullPolicy: Never

          ports:
            - containerPort: {{ .Values.apiGateway.serverPort }}

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.apiGateway.serverPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.apiGateway.serverPort }}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          envFrom:
            - configMapRef:
                name: api-gateway-config

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET

            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: AI_SERVICE_TOKEN
                  optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway

spec:
  selector:
    app: api-gateway

  type: ClusterIP

  ports:
    - port: {{ .Values.apiGateway.serverPort }}
      targetPort: {{ .Values.apiGateway.serverPort }}
