<mat-toolbar color="primary">
  <div class="logo-welcome">
    <span class="logo">Hotel Inventory</span>

    <!-- Show username if logged in -->
    <span *ngIf="userService.isLoggedIn()" class="welcome">
      Hello, {{ userService.getCurrentUser()?.username }}
    </span>
  </div>

  <span class="spacer"></span>

  <a
    mat-button
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    Rooms
  </a>
  <a mat-button routerLink="/search" routerLinkActive="active" data-testid="nav-search"> Search </a>
  <a mat-button routerLink="/bookings" routerLinkActive="active"> Bookings </a>
  <a
    *ngIf="userService.isLoggedIn()"
    mat-button
    routerLink="/loyalty"
    routerLinkActive="active"
    data-testid="nav-loyalty"
  >
    Loyalty
  </a>
  <a *ngIf="userService.isAdmin()" mat-button routerLink="/admin" routerLinkActive="active">
    Admin
  </a>

  <a *ngIf="userService.isAdmin()" mat-button routerLink="/chat" routerLinkActive="active">
    AI Chat
  </a>

  <!-- Guest checkout (Track D): only when logged out -->
  <a
    *ngIf="!userService.isLoggedIn()"
    mat-button
    routerLink="/guest/book"
    routerLinkActive="active"
    data-testid="nav-guest-book"
  >
    Book as guest
  </a>
  <a
    *ngIf="!userService.isLoggedIn()"
    mat-button
    routerLink="/guest/lookup"
    routerLinkActive="active"
    data-testid="nav-guest-lookup"
  >
    Find my booking
  </a>

  <!-- Show login only if NOT logged in -->
  <a *ngIf="!userService.isLoggedIn()" mat-button routerLink="/login" routerLinkActive="active">
    Login
  </a>

  <!-- Show logout only if logged in -->
  <button *ngIf="userService.isLoggedIn()" mat-button (click)="logout()">Logout</button>
</mat-toolbar>
