apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chat-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ai-chat-service

  template:
    metadata:
      labels:
        app: ai-chat-service

    spec:
      containers:
        - name: ai-chat-service

          image: ai-chat-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8084

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6

          envFrom:
            - configMapRef:
                name: ai-chat-config

          env:
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: AI_SERVICE_TOKEN
