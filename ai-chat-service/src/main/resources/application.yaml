spring:
  application:
    name: ai-chat-service

  profiles:
    default: dev

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

ai:
  service-token: ${AI_SERVICE_TOKEN}

services:
  booking:
    url: ${BOOKING_SERVICE_URL:http://localhost:8082}

  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}

  audit:
    url: ${AUDIT_SERVICE_URL:http://localhost:8083}

# The AI provider profile (gemini or ollama) is orthogonal to dev/prod and is
# combined with it, e.g. SPRING_PROFILES_ACTIVE=prod,gemini.
---
spring:
  config:
    activate:
      on-profile: dev

  kafka:
    security:
      protocol: PLAINTEXT

management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod

  kafka:
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG}

management:
  endpoint:
    health:
      show-details: never
