spring:
  datasource:
    url: jdbc:h2:mem:bookingtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate

  # Run the real migrations (schema only, no demo seed) so tests validate them against the entities.
  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

jwt:
  secret: test-only-jwt-secret-key-32-bytes-minimum
