spring:
  application:
    name: booking-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Schema is owned by Flyway (db/migration). Demo seed data lives in db/seed.
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8082}

jwt:
  secret: ${JWT_SECRET}
  expirationMinutes: ${JWT_EXPIRATION_MINUTES:60}

services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  loyalty:
    url: ${LOYALTY_SERVICE_URL:http://localhost:8086}

booking:
  events:
    topic: ${BOOKING_EVENTS_TOPIC:booking-events}
  hold:
    ttl: ${BOOKING_HOLD_TTL:PT15M}
    expiry-interval: ${BOOKING_HOLD_EXPIRY_INTERVAL:PT60S}

payment:
  provider: ${PAYMENT_PROVIDER:mock}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
