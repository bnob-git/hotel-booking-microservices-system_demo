<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title th:text="'Booking ' + ${confirmationCode} + ' ' + ${action}">Booking</title>
</head>
<body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
         style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;">
    <tr>
      <td style="background:#3f51b5;color:#ffffff;padding:20px 24px;font-size:20px;font-weight:bold;">
        Hotel booking <span th:text="${action}">confirmed</span>
      </td>
    </tr>
    <tr>
      <td style="padding:24px;">
        <p>Hello <strong th:text="${guestName}">Guest</strong>,</p>
        <p>Your booking <strong th:text="${confirmationCode}">HB7K2QXM</strong> has been
          <strong th:text="${action}">confirmed</strong>.</p>
        <table role="presentation" cellpadding="6" cellspacing="0" style="width:100%;border-collapse:collapse;">
          <tr><td style="color:#616e7c;">Confirmation code</td>
              <td style="font-family:monospace;font-size:16px;font-weight:bold;" th:text="${confirmationCode}">HB7K2QXM</td></tr>
          <tr><td style="color:#616e7c;">Room</td><td th:text="${roomName}">Room 201</td></tr>
          <tr><td style="color:#616e7c;">Check-in</td><td th:text="${checkIn}">-</td></tr>
          <tr><td style="color:#616e7c;">Check-out</td><td th:text="${checkOut}">-</td></tr>
          <tr><td style="color:#616e7c;">Guests</td><td th:text="${numGuests}">2</td></tr>
          <tr><td style="color:#616e7c;">Total price</td><td th:text="${totalPrice}">360.00 EUR</td></tr>
          <tr th:if="${status}"><td style="color:#616e7c;">Status</td><td th:text="${status}">CONFIRMED</td></tr>
        </table>
        <p style="margin-top:24px;">
          <a th:href="${lookupUrl}" href="#"
             style="background:#3f51b5;color:#ffffff;padding:10px 18px;border-radius:4px;text-decoration:none;">
            View or manage your booking</a>
        </p>
        <p style="font-size:12px;color:#616e7c;">Or open: <span th:text="${lookupUrl}">link</span></p>
        <p>Thank you for staying with us,<br>The Hotel team</p>
      </td>
    </tr>
  </table>
</body>
</html>
