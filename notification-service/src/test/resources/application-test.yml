spring:
  datasource:
    url: jdbc:h2:mem:notificationtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
    listener:
      auto-startup: false

jwt:
  secret: test-only-jwt-secret-key-32-bytes-minimum

notification:
  frontend-base-url: http://localhost:4200
