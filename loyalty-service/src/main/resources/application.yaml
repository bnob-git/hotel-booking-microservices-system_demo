spring:
  application:
    name: loyalty-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loyalty_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      initialization-fail-timeout: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  # Schema is owned by Flyway (db/migration).
  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: loyalty-service
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns a record it cannot decode into a logged + skipped failure
      # instead of blocking the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.hotel.loyalty.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.hotel.loyalty.dto.BookingEvent

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET}

loyalty:
  events:
    topic: ${BOOKING_EVENTS_TOPIC:booking-events}
  points:
    per-euro: ${LOYALTY_POINTS_PER_EURO:10}
    value: ${LOYALTY_POINT_VALUE:0.05}
    redemption-increment: ${LOYALTY_REDEMPTION_INCREMENT:100}
