spring:
  datasource:
    url: jdbc:h2:mem:audittest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none

  # V1__init.sql is PostgreSQL-specific (jsonb, typed check constraint);
  # tests keep using src/test/resources/schema.sql on H2.
  flyway:
    enabled: false
