name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test User Service
        working-directory: user-service
        run: ./mvnw test

      - name: Test Booking Service
        working-directory: booking-service
        run: ./mvnw test

      - name: Test Audit Service
        working-directory: audit-service
        run: ./mvnw test

      - name: Test API Gateway
        working-directory: api-gateway
        run: ./mvnw test

      - name: Test AI Chat Service
        working-directory: ai-chat-service
        run: ./mvnw test

  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --no-progress
