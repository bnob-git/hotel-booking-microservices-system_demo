name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test User Service
        working-directory: user-service
        run: ./mvnw clean package

      - name: Build and test Booking Service
        working-directory: booking-service
        run: ./mvnw clean package

      - name: Build and test Audit Service
        working-directory: audit-service
        run: ./mvnw clean package

      - name: Build and test API Gateway
        working-directory: api-gateway
        run: ./mvnw clean package

      - name: Build and test AI Chat Service
        working-directory: ai-chat-service
        run: ./mvnw clean package

      - name: Upload backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            user-service/target/*.jar
            booking-service/target/*.jar
            audit-service/target/*.jar
            api-gateway/target/*.jar
            ai-chat-service/target/*.jar


  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --no-progress --browsers=ChromeHeadless

      - name: Build frontend
        run: npm run build


  docker-build:
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: milanpopovic87

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-jars

      - name: Build User Service image
        run: docker build -t $REGISTRY/$IMAGE_OWNER/hotel-booking-user-service:latest ./user-service

      - name: Build Booking Service image
        run: docker build -t $REGISTRY/$IMAGE_OWNER/hotel-booking-booking-service:latest ./booking-service

      - name: Build Audit Service image
        run: docker build -t $REGISTRY/$IMAGE_OWNER/hotel-booking-audit-service:latest ./audit-service

      - name: Build API Gateway image
        run: docker build -t $REGISTRY/$IMAGE_OWNER/hotel-booking-api-gateway:latest ./api-gateway

      - name: Build AI Chat Service image
        run: docker build -t $REGISTRY/$IMAGE_OWNER/hotel-booking-ai-chat-service:latest ./ai-chat-service

      - name: Build Frontend image
        run: docker build -t $REGISTRY/$IMAGE_OWNER/hotel-booking-frontend:latest ./frontend

      - name: Push User Service image
        run: docker push $REGISTRY/$IMAGE_OWNER/hotel-booking-user-service:latest

      - name: Push Booking Service image
        run: docker push $REGISTRY/$IMAGE_OWNER/hotel-booking-booking-service:latest

      - name: Push Audit Service image
        run: docker push $REGISTRY/$IMAGE_OWNER/hotel-booking-audit-service:latest

      - name: Push API Gateway image
        run: docker push $REGISTRY/$IMAGE_OWNER/hotel-booking-api-gateway:latest

      - name: Push AI Chat Service image
        run: docker push $REGISTRY/$IMAGE_OWNER/hotel-booking-ai-chat-service:latest

      - name: Push Frontend image
        run: docker push $REGISTRY/$IMAGE_OWNER/hotel-booking-frontend:latest
